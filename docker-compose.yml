version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app/server:/app/server
    command: uvicorn app.server.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./app/web
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_BACKEND_HTTP_URL=http://backend:8000
      - NEXT_PUBLIC_BACKEND_WS_URL=ws://backend:8000
    depends_on:
      - backend
